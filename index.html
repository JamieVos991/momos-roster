<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momo's Rooster</title>
    <meta
      name="description"
      content="Bekijk wie er vandaag werken bij Momo's."
    />
    <link rel="icon" href="images/favicon.png" />
    <link rel="stylesheet" href="styles/styleguide.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <script>
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <header class="site-header">
      <span class="logo">Momo's Rooster</span>
      <a href="dashboard.html" class="btn btn--ghost">Beheer</a>
    </header>

    <main id="main">
      <div class="day-nav">
        <button class="btn btn--icon" id="prev-day" aria-label="Vorige dag">
          &#8592;
        </button>
        <h1 class="day-title" id="day-title">Laden…</h1>
        <button class="btn btn--icon" id="next-day" aria-label="Volgende dag">
          &#8594;
        </button>
      </div>

      <div class="roster" id="roster">
        <section class="roster__section" id="section-bediening">
          <h2 class="roster__heading">Bediening</h2>
          <ul class="card-list" id="list-bediening"></ul>
        </section>

        <section class="roster__section" id="section-keuken">
          <h2 class="roster__heading">Keuken</h2>
          <ul class="card-list" id="list-keuken"></ul>
        </section>
      </div>

      <p class="empty-state" id="empty-state" hidden>
        Geen diensten ingepland voor deze dag.
      </p>

      <section class="events-section">
        <h2 class="events-section__heading">Evenementen</h2>
        <ul class="events-list" id="events-list">
          <li class="event-card event-card--loading"></li>
        </ul>
      </section>

      <section class="my-roster-section">
        <h2 class="my-roster-section__heading">Mijn rooster</h2>
        <div class="form-group">
          <label for="my-name">Jouw naam</label>
          <input type="text" id="my-name" placeholder="Bijv. Lisa" autocomplete="off" />
        </div>
        <ul class="my-shifts" id="my-shifts"></ul>
      </section>
    </main>

    <script type="module" src="scripts/roster.js"></script>
  </body>
</html>
